[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-navgen"
version = "0.1.0"
description = "Offline Source v16 navigation mesh generation"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "numba==0.63.1", "vpk==1.4.0"]

[tool.setuptools]
packages = ["navgen"]
